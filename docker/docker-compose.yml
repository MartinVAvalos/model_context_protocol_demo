services:
  mcp-server:
    build:
      context: ../
      dockerfile: docker/Dockerfile.mcp
    environment:
      - DB_PATH=/app/db/family_movies.sqlite
      - ASPNETCORE_URLS=http://+:5000

  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      - DB_PATH=/app/db/family_movies.sqlite
      - MCP_SERVER_URL=http://mcp-server:5000
    ports:
      - "8080:8080"
    depends_on:
      - mcp-server

  frontend:
    build:
      context: ../
      dockerfile: docker/Dockerfile.frontend
    environment:
      - VITE_API_BASE=http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
